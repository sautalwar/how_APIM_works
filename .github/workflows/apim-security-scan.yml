# APIM Policy Security Scan
# Runs on every PR that touches policy files, Bicep infrastructure, or scanner code.
# Performs: XML linting, policy security scanning, SARIF upload to GitHub Security tab.

name: "🔒 APIM Policy Security Scan"

on:
  pull_request:
    paths:
      - 'policies/**'
      - 'infra/**'
      - 'security-scanner/**'
  push:
    branches: [main, master]
    paths:
      - 'policies/**'
      - 'infra/**'

permissions:
  contents: read
  security-events: write
  pull-requests: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Validate XML syntax and Bicep lint
  # ─────────────────────────────────────────────
  lint:
    name: "📋 Lint & Validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate XML syntax
        run: |
          echo "🔍 Checking XML syntax for all policy files..."
          errors=0
          for file in $(find policies/ -name "*.xml"); do
            if ! python3 -c "import xml.etree.ElementTree as ET; ET.parse('$file')" 2>/dev/null; then
              echo "❌ Invalid XML: $file"
              errors=$((errors + 1))
            else
              echo "✅ Valid: $file"
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "::error::Found $errors XML syntax errors"
            exit 1
          fi
          echo "✅ All XML files are valid"

      - name: Lint Bicep templates
        if: hashFiles('infra/**/*.bicep') != ''
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          echo "✅ Bicep templates are valid"

  # ─────────────────────────────────────────────
  # Job 2: Run policy security scanner
  # ─────────────────────────────────────────────
  security-scan:
    name: "🔬 Policy Security Scan"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanner dependencies
        run: pip install -r security-scanner/requirements.txt

      - name: Run security scanner (JSON output for PR comment)
        id: scan-json
        run: |
          set +e
          python security-scanner/scanner.py policies/ \
            --format json \
            --output scan-results.json \
            --fail-on critical
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ No critical issues found"
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "⚠️ Security issues found"
          else
            echo "❌ Scanner error"
          fi
          exit 0

      - name: Run security scanner (SARIF output)
        run: |
          python security-scanner/scanner.py policies/ \
            --format sarif \
            --output policy-scan-results.sarif \
            --fail-on critical || true

      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('policy-scan-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: policy-scan-results.sarif
          category: apim-policy-security

      - name: Run security scanner (text output for logs)
        run: |
          echo "🔍 Scanning APIM policies for security issues..."
          python security-scanner/scanner.py policies/ --format text --fail-on critical || true

      - name: Comment PR with scan results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let findings = [];
            try {
              const scanFile = 'scan-results.json';
              if (fs.existsSync(scanFile)) {
                const data = fs.readFileSync(scanFile, 'utf8');
                findings = JSON.parse(data);
              }
            } catch (error) {
              console.log('Unable to read scan results:', error.message);
              return;
            }
            
            const critical = findings.filter(f => f.severity === 'critical');
            const high = findings.filter(f => f.severity === 'high');
            const medium = findings.filter(f => f.severity === 'medium');
            const low = findings.filter(f => f.severity === 'low');
            
            let body = '## 🔒 APIM Policy Security Scan Results\n\n';
            body += `| Severity | Count |\n|----------|-------|\n`;
            body += `| 🔴 Critical | ${critical.length} |\n`;
            body += `| 🟠 High | ${high.length} |\n`;
            body += `| 🟡 Medium | ${medium.length} |\n`;
            body += `| 🔵 Low | ${low.length} |\n`;
            body += `| **Total** | **${findings.length}** |\n\n`;
            
            if (findings.length === 0) {
              body += '✅ **No security issues found!** All policies are secure.\n';
            } else if (critical.length > 0 || high.length > 0) {
              body += '### ⚠️ Blocking Issues\n\n';
              [...critical, ...high].slice(0, 5).forEach(f => {
                body += `- **[${f.rule_id}] ${f.rule_name}** (${f.severity})\n`;
                body += `  - File: \`${f.file}\`\n`;
                body += `  - Issue: ${f.description}\n`;
                body += `  - Fix: ${f.recommendation}\n\n`;
              });
              if (critical.length + high.length > 5) {
                body += `\n_... and ${critical.length + high.length - 5} more issue(s). Check the logs for details._\n`;
              }
              body += '\n> ⛔ This PR is blocked until critical/high issues are resolved.';
            } else {
              body += '### ℹ️ Non-blocking Issues\n\n';
              body += `Found ${medium.length + low.length} medium/low severity issues. Please review when possible.\n`;
            }
            
            body += '\n\n---\n*View detailed results in the [Security tab](https://github.com/${{ github.repository }}/security/code-scanning)*';
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });
      
      - name: Display security findings
        if: always()
        run: |
          if [ ! -f scan-results.json ]; then
            echo "No scan results found"
            exit 0
          fi
          
          echo "======================================================================"
          echo "                    SECURITY SCAN FINDINGS                          "
          echo "======================================================================"
          echo ""
          
          # Display summary counts
          python3 << 'EOF'
          import json
          
          with open('scan-results.json') as f:
              findings = json.load(f)
          
          critical = [f for f in findings if f['severity'] == 'critical']
          high = [f for f in findings if f['severity'] == 'high']
          medium = [f for f in findings if f['severity'] == 'medium']
          low = [f for f in findings if f['severity'] == 'low']
          
          print(f"📊 SUMMARY:")
          print(f"  🔴 Critical: {len(critical)}")
          print(f"  🟠 High: {len(high)}")
          print(f"  🟡 Medium: {len(medium)}")
          print(f"  🔵 Low: {len(low)}")
          print(f"  📋 Total: {len(findings)}")
          print("")
          
          if critical:
              print("="*70)
              print("🔴 CRITICAL SEVERITY ISSUES (BLOCKING)")
              print("="*70)
              for i, f in enumerate(critical, 1):
                  print(f"\n[{i}] {f['rule_id']}: {f['rule_name']}")
                  print(f"    File: {f['file']}")
                  print(f"    Category: {f['category']} | OWASP: {f['owasp']}")
                  print(f"    Issue: {f['description']}")
                  print(f"    Fix: {f['recommendation']}")
          
          if high:
              print("\n" + "="*70)
              print("🟠 HIGH SEVERITY ISSUES (WARNING)")
              print("="*70)
              for i, f in enumerate(high, 1):
                  print(f"\n[{i}] {f['rule_id']}: {f['rule_name']}")
                  print(f"    File: {f['file']}")
                  print(f"    Category: {f['category']} | OWASP: {f['owasp']}")
                  print(f"    Issue: {f['description']}")
                  print(f"    Fix: {f['recommendation']}")
          
          if medium:
              print(f"\n{'='*70}")
              print(f"🟡 MEDIUM SEVERITY: {len(medium)} issues (see logs above for details)")
          
          if low:
              print(f"🔵 LOW SEVERITY: {len(low)} issues (see logs above for details)")
          
          print("\n" + "="*70)
          EOF
      
      - name: Check for blocking issues
        id: check-blocking
        run: |
          if [ ! -f scan-results.json ]; then
            echo "No scan results found"
            exit 0
          fi
          
          # Count critical and high severity issues
          CRITICAL_COUNT=$(python3 -c "import json; f=open('scan-results.json'); data=json.load(f); print(len([x for x in data if x['severity']=='critical']))")
          HIGH_COUNT=$(python3 -c "import json; f=open('scan-results.json'); data=json.load(f); print(len([x for x in data if x['severity']=='high']))")
          
          echo "Critical issues: $CRITICAL_COUNT"
          echo "High issues: $HIGH_COUNT"
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::Found $CRITICAL_COUNT critical severity issues - Review the 'Display security findings' step above for details"
            exit 1
          elif [ "$HIGH_COUNT" -gt 0 ]; then
            echo "::warning::Found $HIGH_COUNT high severity issues (not blocking)"
            exit 0
          fi

  # ─────────────────────────────────────────────
  # Job 3: Bicep what-if (on main/master branch only)
  # ─────────────────────────────────────────────
  whatif:
    name: "🔮 Bicep What-If"
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run what-if deployment
        run: |
          az deployment group what-if \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam

# Container Security Scan
# Scans all container images for vulnerabilities using Trivy
# Triggered on-demand via workflow_dispatch or on PR/push to container files

name: "🐳 Container Security Scan"

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      severity:
        description: 'Minimum severity to report (CRITICAL, HIGH, MEDIUM, LOW)'
        required: false
        default: 'MEDIUM'
        type: choice
        options:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW
  pull_request:
    paths:
      - '**/Dockerfile'
      - '**/package*.json'
      - '.github/workflows/container-security-scan.yml'
  push:
    branches: [main, master]
    paths:
      - '**/Dockerfile'

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  SEVERITY: ${{ inputs.severity || 'MEDIUM' }}

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Scan Dockerfiles (static analysis)
  # ─────────────────────────────────────────────
  dockerfile-scan:
    name: "📋 Scan Dockerfiles"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy on Dockerfiles
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-dockerfile-results.sarif'
          severity: ${{ env.SEVERITY }},CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Dockerfile scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-dockerfile-results.sarif'
          category: 'dockerfile-security'

      - name: Generate Dockerfile scan summary
        if: always()
        run: |
          echo "## 📋 Dockerfile Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Type:** Static analysis of Dockerfile configurations" >> $GITHUB_STEP_SUMMARY
          echo "**Minimum Severity:** ${{ env.SEVERITY }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the Security tab for detailed findings." >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # Job 2: Build and scan sample-api container
  # ─────────────────────────────────────────────
  scan-sample-api:
    name: "🔍 Scan sample-api Container"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build sample-api image
        run: |
          echo "🏗️ Building sample-api container..."
          docker build -t sample-api:${{ github.sha }} ./sample-api
          docker tag sample-api:${{ github.sha }} sample-api:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sample-api:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-sample-api-results.sarif'
          severity: ${{ env.SEVERITY }},CRITICAL,HIGH
          exit-code: '0'

      - name: Upload sample-api scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-sample-api-results.sarif'
          category: 'sample-api-container'

      - name: Run Trivy for human-readable output
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sample-api:${{ github.sha }}'
          format: 'table'
          severity: ${{ env.SEVERITY }},CRITICAL,HIGH
          exit-code: '0'

      - name: Generate scan summary
        if: always()
        run: |
          echo "## 🐳 sample-api Container Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** sample-api:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Base Image:** node:20-alpine" >> $GITHUB_STEP_SUMMARY
          echo "**Minimum Severity:** ${{ env.SEVERITY }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          docker images sample-api:${{ github.sha }} --format "**Size:** {{.Size}}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for detailed vulnerability information." >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # Job 3: Aggregate results and post PR comment
  # ─────────────────────────────────────────────
  report:
    name: "📊 Generate Security Report"
    runs-on: ubuntu-latest
    needs: [dockerfile-scan, scan-sample-api]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Post PR comment with results
        uses: actions/github-script@v7
        with:
          script: |
            const output = `## 🐳 Container Security Scan Results

            **Triggered by:** ${context.eventName === 'workflow_dispatch' ? 'Manual trigger' : context.eventName}
            **Commit:** ${context.sha.substring(0, 7)}
            **Minimum Severity:** ${{ env.SEVERITY }}

            ### 📋 Scans Performed
            - ✅ Dockerfile static analysis
            - ✅ sample-api container image scan (node:20-alpine)

            ### 🔍 Findings
            Detailed vulnerability reports have been uploaded to the [Security tab](${context.payload.repository.html_url}/security/code-scanning).

            **Categories:**
            - \`dockerfile-security\` - Dockerfile misconfigurations
            - \`sample-api-container\` - OS and dependency vulnerabilities

            ### 🛠️ Next Steps
            1. Review findings in the Security tab
            2. Update base images to latest versions
            3. Update package dependencies with \`npm audit fix\`
            4. Re-run scan to verify fixes

            ---
            *Scan powered by [Trivy](https://github.com/aquasecurity/trivy)*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # ─────────────────────────────────────────────
  # Job 4: Security gate (optional - fails on CRITICAL)
  # ─────────────────────────────────────────────
  security-gate:
    name: "🚨 Security Gate"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build sample-api image
        run: |
          docker build -t sample-api:scan ./sample-api

      - name: Run Trivy with exit code on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sample-api:scan'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'  # Fail the job if CRITICAL vulnerabilities found
          
      - name: Security gate passed
        if: success()
        run: |
          echo "✅ No CRITICAL vulnerabilities found"
          echo "## ✅ Security Gate: PASSED" >> $GITHUB_STEP_SUMMARY
          echo "No CRITICAL vulnerabilities detected in containers" >> $GITHUB_STEP_SUMMARY
